<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story — ??? </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .secret-section{
    min-height:80svh; padding:8vh 6vw; max-width:640px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .secret-mark{ font-size:1.6rem; color:var(--gold-soft); }
  .secret-note{
    margin-top:1em; color:var(--text-dim); font-size:0.88rem; line-height:1.9; max-width:420px;
  }
  .player-wrap{
    margin-top:3em; width:100%; aspect-ratio:16/9;
    background:#000; border-radius:10px; overflow:hidden;
    border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,0.5);
  }
  .player-wrap iframe{ width:100%; height:100%; display:block; }
  .back-link{
    margin-top:2.4em; font-family:var(--font-en); font-style:italic; font-size:0.82rem;
    color:var(--text-dim); text-decoration:none;
  }
  .back-link:hover{ color:var(--gold-soft); }
</style>
</head>
<body>

<div class="grain"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<section class="secret-section">
  <p class="secret-mark reveal">✦ ここまでよく見つけましたね ✦</p>
  <p class="secret-note reveal">
    このサイトを作っているときの、ちょっとした記録動画です。<br>
    誰にも教えなくていいので、こっそり見ていってください。
  </p>

  <div class="player-wrap reveal">
    <!-- ▼ ここにYouTubeの動画IDを入れてください（限定公開推奨） -->
    <iframe
      src="https://www.youtube.com/embed/REPLACE_WITH_VIDEO_ID?rel=0"
      title="making of"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <a class="back-link reveal" href="story.html" data-nav>← 何事もなかったように戻る</a>
</section>

<script src="assets/auth.js"></script>
<script src="assets/effects.js"></script>
<script>
  protectPage();
  wireNavLinks();

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){ entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
