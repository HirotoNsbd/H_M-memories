<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモ — 思い出クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  .demo-nav{
    display:flex; align-items:center; justify-content:center;
    padding:16px 6vw; position:relative; z-index:2;
  }
  .demo-nav a{
    font-family:var(--font-en); font-style:italic; font-size:0.9rem;
    color:var(--text-dim); text-decoration:none;
  }
  .demo-nav a:hover{ color:var(--gold-soft); }
  .demo-badge{
    display:inline-block; margin-top:0.6em;
    font-family:var(--font-en); font-style:italic; font-size:0.7rem;
    letter-spacing:0.2em; color:var(--rose);
    border:1px solid var(--rose); border-radius:20px; padding:3px 12px;
  }

  .quiz-section{
    min-height:80svh; padding:4vh 6vw 12vh; max-width:560px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    position:relative; z-index:2;
  }

  .quiz-progress{ display:flex; gap:8px; margin:2em 0 3em; }
  .quiz-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); transition:background 0.3s ease, transform 0.3s ease; }
  .quiz-dot.is-done{ background:var(--gold); }
  .quiz-dot.is-current{ background:var(--gold-soft); transform:scale(1.3); }

  .quiz-card{ width:100%; }
  .quiz-question{
    font-family:var(--font-jp-serif); font-weight:600;
    font-size:clamp(1.2rem, 4.5vw, 1.5rem); margin:0 0 1.6em; line-height:1.7;
  }

  .quiz-options{ display:flex; flex-direction:column; gap:12px; }
  .quiz-option{
    text-align:left; font-family:var(--font-jp-sans); font-size:0.96rem;
    color:var(--text); background:var(--ink-soft); border:1px solid var(--line);
    padding:16px 20px; border-radius:4px; cursor:pointer;
    transition:border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
    position:relative;
  }
  .quiz-option:hover:not(:disabled){ border-color:var(--gold); }
  .quiz-option:active:not(:disabled){ transform:scale(0.98); }
  .quiz-option:disabled{ cursor:default; }
  .quiz-option.is-correct{
    border-color:#7fae87; background:rgba(127,174,135,0.14); color:#c9e6cf;
    animation:pop 0.4s ease;
  }
  .quiz-option.is-wrong{
    border-color:var(--rose); background:rgba(186,139,134,0.14);
    animation:shake 0.4s ease;
  }
  .quiz-option .mark{ float:right; font-size:0.9rem; }
  @keyframes pop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.03); } 100%{ transform:scale(1); } }
  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-6px); } 75%{ transform:translateX(6px); } }
  @media (prefers-reduced-motion: reduce){ .quiz-option.is-correct, .quiz-option.is-wrong{ animation:none; } }

  .quiz-feedback{
    margin-top:1.4em; font-size:0.88rem; min-height:1.4em;
    color:var(--text-dim);
  }
  .quiz-feedback.ok{ color:#a9d1af; }
  .quiz-feedback.ng{ color:var(--rose); }

  .quiz-next{
    margin-top:1.6em;
    font-family:var(--font-en); font-style:italic; font-size:0.9rem;
    color:var(--gold-soft); background:none; border:1px solid var(--line);
    padding:10px 26px; border-radius:2px; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity 0.3s ease, border-color 0.2s ease;
  }
  .quiz-next.is-visible{ opacity:1; pointer-events:auto; }
  .quiz-next:hover{ border-color:var(--gold); }

  /* ---- 結果 ---- */
  .result-score{
    font-family:var(--font-en); font-weight:600;
    font-size:clamp(2.6rem, 10vw, 4rem); color:var(--gold-soft); line-height:1;
  }
  .result-score span{ font-size:0.4em; color:var(--text-dim); font-style:italic; }
  .result-msg{
    margin-top:1em; font-family:var(--font-jp-serif); font-size:1.2rem; color:var(--text);
  }
  .fade-swap{ animation:fade-swap 0.45s ease; }
  @keyframes fade-swap{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .fade-swap{ animation:none; } }
</style>
</head>
<body>

<div class="grain"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<nav class="demo-nav"><a href="index.html">← デモ一覧に戻る</a></nav>

<section class="quiz-section">
  <p class="eyebrow reveal">Memory Quiz</p>
  <h2 class="section-title reveal">思い出クイズ</h2>
  <span class="demo-badge reveal">DEMO / 試作品</span>

  <div class="quiz-progress" id="quiz-progress"></div>
  <div class="quiz-card" id="quiz-card"></div>
</section>

<script src="../assets/effects.js"></script>
<script>
  // ---- サンプル問題（デモ用のダミーデータ） ----
  const QUESTIONS = [
    {
      text: '初デートの場所は？',
      options: ['渋谷', '新宿', '横浜', '浅草'],
      correct: 0
    },
    {
      text: '初めてディズニーへ行ったのはいつ？',
      options: ['2025年12月', '2026年1月', '2026年3月', '2026年4月'],
      correct: 1
    },
    {
      text: '付き合って100日を迎えたのはいつ？',
      options: ['2026年1月2日', '2026年1月12日', '2026年2月1日', '2026年3月20日'],
      correct: 1
    },
    {
      text: '一緒に行った旅行先は？',
      options: ['京都', '福岡', '沖縄', '北海道'],
      correct: 0
    },
    {
      text: 'はじめて二人で行ったお店を訪れたのは何月？',
      options: ['1月', '2月', '3月', '4月'],
      correct: 2
    }
  ];

  const progressEl = document.getElementById('quiz-progress');
  const cardEl = document.getElementById('quiz-card');
  let currentIndex = 0;
  let score = 0;

  function renderProgress(){
    progressEl.innerHTML = '';
    for (let i = 0; i < QUESTIONS.length; i++){
      const dot = document.createElement('span');
      dot.className = 'quiz-dot' + (i < currentIndex ? ' is-done' : (i === currentIndex ? ' is-current' : ''));
      progressEl.appendChild(dot);
    }
  }

  function renderQuestion(){
    renderProgress();
    const q = QUESTIONS[currentIndex];
    const optionsHtml = q.options.map((label, i) => `
      <button class="quiz-option" data-index="${i}">${label}</button>
    `).join('');

    cardEl.innerHTML = `
      <div class="fade-swap">
        <p class="quiz-question">${q.text}</p>
        <div class="quiz-options">${optionsHtml}</div>
        <p class="quiz-feedback" id="quiz-feedback"></p>
        <button class="quiz-next" id="quiz-next">次の問題へ →</button>
      </div>
    `;

    const optionButtons = cardEl.querySelectorAll('.quiz-option');
    const feedback = document.getElementById('quiz-feedback');
    const nextBtn = document.getElementById('quiz-next');

    optionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = Number(btn.dataset.index);
        optionButtons.forEach(b => b.disabled = true);

        if (chosen === q.correct){
          btn.classList.add('is-correct');
          btn.innerHTML += '<span class="mark">◯</span>';
          feedback.textContent = '正解です！さすが。';
          feedback.className = 'quiz-feedback ok';
          score++;
        } else {
          btn.classList.add('is-wrong');
          btn.innerHTML += '<span class="mark">✕</span>';
          optionButtons[q.correct].classList.add('is-correct');
          feedback.textContent = '残念、正解はこちらでした。';
          feedback.className = 'quiz-feedback ng';
        }
        nextBtn.classList.add('is-visible');
      });
    });

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      if (currentIndex < QUESTIONS.length){
        renderQuestion();
      } else {
        renderResult();
      }
    });
  }

  function renderResult(){
    progressEl.innerHTML = '';
    const total = QUESTIONS.length;
    let msg = 'また挑戦してみてね。';
    if (score === total) msg = '全問正解！二人の絆はバッチリです ❤';
    else if (score >= total * 0.6) msg = 'なかなかの正解率！いい感じです。';

    cardEl.innerHTML = `
      <div class="fade-swap">
        <p class="result-score">${score}<span> / ${total}</span></p>
        <p class="result-msg">${msg}</p>
        <button class="btn" id="retry-btn" style="margin-top:2em;">もう一度挑戦する</button>
      </div>
    `;
    document.getElementById('retry-btn').addEventListener('click', () => {
      currentIndex = 0;
      score = 0;
      renderQuestion();
    });
  }

  renderQuestion();
</script>
</body>
</html>
