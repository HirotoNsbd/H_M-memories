<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモ — 昼夜モード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* このデモは昼夜で配色そのものが変わるため、site.cssの色トークンを
     ローカルで上書きできるよう、あえてこのファイル内に色定義を持たせています */
  :root{
    --ink:        #12141c;
    --ink-alt:    #1a1e2a;
    --ink-soft:   #232838;
    --paper:      #efe8d8;
    --gold:       #c9a96a;
    --gold-soft:  #e3cfa0;
    --rose:       #ba8b86;
    --text:       #f3ede0;
    --text-dim:   #a9a496;
    --line:       rgba(201,169,106,0.35);

    --font-en: 'Cormorant Garamond', serif;
    --font-jp-serif: 'Shippori Mincho', serif;
    --font-jp-sans: 'Zen Kaku Gothic New', sans-serif;
  }

  /* ---- 昼モードの配色（暖かいアイボリー×ゴールド） ---- */
  body.day-mode{
    --ink:        #faf5ea;
    --ink-alt:    #f3ead6;
    --ink-soft:   #ffffff;
    --gold:       #c9a96a;
    --gold-soft:  #a9823f;
    --rose:       #c07a72;
    --text:       #3c3324;
    --text-dim:   #8a7c63;
    --line:       rgba(169,130,63,0.3);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100svh;
    background:var(--ink); color:var(--text);
    font-family:var(--font-jp-sans);
    transition:background 0.7s ease, color 0.7s ease;
  }

  .demo-nav{ display:flex; align-items:center; justify-content:center; padding:16px 6vw; }
  .demo-nav a{ font-family:var(--font-en); font-style:italic; font-size:0.9rem; color:var(--text-dim); text-decoration:none; transition:color 0.7s ease; }
  .demo-nav a:hover{ color:var(--gold-soft); }

  .hero{
    min-height:60svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:6vh 6vw;
  }
  .eyebrow{ font-family:var(--font-en); letter-spacing:0.35em; text-transform:uppercase; font-size:0.72rem; color:var(--gold); transition:color 0.7s ease; }
  .section-title{ font-family:var(--font-jp-serif); font-weight:700; font-size:clamp(1.8rem, 6vw, 2.6rem); margin:0.4em 0 0; transition:color 0.7s ease; }
  .demo-badge{
    display:inline-block; margin-top:0.8em;
    font-family:var(--font-en); font-style:italic; font-size:0.7rem;
    letter-spacing:0.2em; color:var(--rose);
    border:1px solid var(--rose); border-radius:20px; padding:3px 12px;
    transition:color 0.7s ease, border-color 0.7s ease;
  }

  .toggle-wrap{ margin-top:2.6em; display:flex; justify-content:center; }
  .mode-toggle{
    display:flex; align-items:center; gap:14px;
    background:var(--ink-soft); border:1px solid var(--line);
    border-radius:99px; padding:8px 10px;
    cursor:pointer; transition:background 0.7s ease, border-color 0.7s ease;
  }
  .mode-toggle .icon{ font-size:1.1rem; width:28px; text-align:center; }
  .mode-toggle .track{
    width:44px; height:24px; border-radius:99px; background:var(--line);
    position:relative; transition:background 0.4s ease;
  }
  .mode-toggle .thumb{
    position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:var(--gold); transition:transform 0.4s cubic-bezier(.22,.68,.36,1), background 0.4s ease;
  }
  body.day-mode .mode-toggle .thumb{ transform:translateX(20px); }

  /* ---- 見本カード ---- */
  .demo-cards{
    max-width:900px; margin:6vh auto 10vh; padding:0 6vw;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px;
  }
  .demo-card{
    background:var(--ink-alt); border:1px solid var(--line);
    border-radius:10px; padding:24px; text-align:center;
    transition:background 0.7s ease, border-color 0.7s ease;
  }
  .demo-card .card-icon{ font-size:1.8rem; }
  .demo-card .card-title{ margin-top:0.8em; font-family:var(--font-jp-serif); font-size:1.1rem; color:var(--text); transition:color 0.7s ease; }
  .demo-card .card-desc{ margin-top:0.5em; font-size:0.85rem; color:var(--text-dim); line-height:1.8; transition:color 0.7s ease; }

  .polaroid{
    background:var(--paper); padding:10px 10px 22px; width:120px; margin:0 auto;
    border-radius:2px; box-shadow:0 10px 22px rgba(0,0,0,0.25); transform:rotate(-3deg);
  }
  .polaroid-photo{
    width:100%; aspect-ratio:1/1; background:var(--ink-soft);
    border:1px dashed var(--line); display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; color:var(--text-dim); transition:background 0.7s ease, border-color 0.7s ease;
  }

  .btn-sample{
    font-family:var(--font-jp-sans); font-size:0.9rem; color:var(--ink);
    background:linear-gradient(var(--gold-soft), var(--gold));
    border:none; padding:12px 26px; border-radius:2px; cursor:pointer;
    transition:background 0.7s ease;
  }
</style>
</head>
<body>

<nav class="demo-nav"><a href="index.html">← デモ一覧に戻る</a></nav>

<section class="hero">
  <p class="eyebrow">Day / Night Mode</p>
  <h2 class="section-title">昼夜モード</h2>
  <span class="demo-badge">DEMO / 試作品</span>

  <div class="toggle-wrap">
    <button class="mode-toggle" id="mode-toggle" aria-label="昼夜を切り替える">
      <span class="icon">☀️</span>
      <span class="track"><span class="thumb"></span></span>
      <span class="icon">🌙</span>
    </button>
  </div>
</section>

<div class="demo-cards">
  <div class="demo-card">
    <div class="polaroid"><div class="polaroid-photo">📷</div></div>
    <p class="card-title" style="margin-top:1em;">思い出カード</p>
    <p class="card-desc">写真やカードの見え方も一緒に変化します</p>
  </div>
  <div class="demo-card">
    <div class="card-icon">♡</div>
    <p class="card-title">アイコン</p>
    <p class="card-desc">アイコンの色味も昼夜でやわらかく変わります</p>
  </div>
  <div class="demo-card">
    <div class="card-icon">✦</div>
    <p class="card-title">ボタン・文字</p>
    <p class="card-desc">背景・文字色・カード全体が自然に切り替わります</p>
    <div style="margin-top:1.2em;"><button class="btn-sample">サンプルボタン</button></div>
  </div>
</div>

<script>
  const toggle = document.getElementById('mode-toggle');
  toggle.addEventListener('click', () => {
    document.body.classList.toggle('day-mode');
  });
</script>
</body>
</html>
