<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモ — 雨の日モード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
  .demo-nav{ display:flex; align-items:center; justify-content:center; padding:16px 6vw; position:relative; z-index:3; }
  .demo-nav a{ font-family:var(--font-en); font-style:italic; font-size:0.9rem; color:var(--text-dim); text-decoration:none; }
  .demo-nav a:hover{ color:var(--gold-soft); }
  .demo-badge{
    display:inline-block; margin-top:0.6em;
    font-family:var(--font-en); font-style:italic; font-size:0.7rem;
    letter-spacing:0.2em; color:var(--rose);
    border:1px solid var(--rose); border-radius:20px; padding:3px 12px;
  }

  .hero{
    min-height:70svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:6vh 6vw; position:relative; z-index:2;
  }

  .rain-toggle{
    margin-top:2.4em;
    font-family:var(--font-jp-sans); font-size:0.9rem; color:var(--ink);
    background:linear-gradient(var(--gold-soft), var(--gold));
    border:none; padding:12px 26px; border-radius:2px; cursor:pointer;
  }

  .quote-card{
    max-width:420px; margin:6vh auto 10vh; padding:0 6vw; position:relative; z-index:2;
  }
  .quote-inner{
    background:var(--ink-alt); border:1px solid var(--line); border-radius:10px;
    padding:32px 28px; text-align:center;
  }
  .quote-inner .mark{ color:var(--gold); font-family:var(--font-en); font-size:1.6rem; }
  .quote-inner p{ font-family:var(--font-jp-serif); font-size:1.05rem; line-height:2; color:var(--text); margin:0.6em 0; }
  .quote-inner .sign{ font-family:var(--font-en); font-style:italic; color:var(--text-dim); font-size:0.85rem; }

  /* ---- 雨の演出 ---- */
  .rain-layer{
    position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;
    opacity:0; transition:opacity 1s ease;
  }
  .rain-layer.is-on{ opacity:1; }
  .drop{
    position:absolute; top:-6%;
    width:1px;
    background:linear-gradient(to bottom, transparent, rgba(227,207,160,0.35), transparent);
    animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;
    will-change:transform, opacity;
  }
  @keyframes fall{
    0%{ transform:translateY(0); opacity:0; }
    10%{ opacity:0.5; }
    95%{ opacity:0.4; }
    100%{ transform:translateY(112vh); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .drop{ animation:none; display:none; }
  }
</style>
</head>
<body>

<div class="grain"></div>
<div class="rain-layer" id="rain-layer" aria-hidden="true"></div>

<nav class="demo-nav"><a href="index.html">← デモ一覧に戻る</a></nav>

<section class="hero">
  <p class="eyebrow reveal">Rainy Day Mode</p>
  <h2 class="section-title reveal">雨の日モード</h2>
  <span class="demo-badge reveal">DEMO / 試作品</span>
  <button class="rain-toggle" id="rain-toggle">☔ 雨を降らせる</button>
</section>

<div class="quote-card reveal">
  <div class="quote-inner">
    <span class="mark">“</span>
    <p>雨の日も、二人で過ごせば悪くないね。</p>
    <span class="sign">— サンプルの思い出コメント</span>
  </div>
</div>

<script>
  const rainLayer = document.getElementById('rain-layer');
  const toggleBtn = document.getElementById('rain-toggle');
  let dropsBuilt = false;
  let isOn = false;

  function buildDrops(){
    if (dropsBuilt) return;
    dropsBuilt = true;
    const count = window.innerWidth < 480 ? 40 : (window.innerWidth < 900 ? 60 : 90);
    for (let i = 0; i < count; i++){
      const d = document.createElement('span');
      d.className = 'drop';
      d.style.left = (Math.random() * 100) + '%';
      d.style.height = (14 + Math.random() * 18) + 'px';
      d.style.animationDuration = (0.7 + Math.random() * 0.6) + 's';
      d.style.animationDelay = (Math.random() * -1.4) + 's';
      rainLayer.appendChild(d);
    }
  }

  toggleBtn.addEventListener('click', () => {
    isOn = !isOn;
    if (isOn) buildDrops();
    rainLayer.classList.toggle('is-on', isOn);
    toggleBtn.textContent = isOn ? '☀️ 雨をやませる' : '☔ 雨を降らせる';
  });

  // ---- reveal ----
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){ entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
